version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infinity_marketing
    ports:
      - "5432:5432"
    volumes:
      - infinity_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/infinity_marketing
      JWT_SECRET: replace_this_with_a_long_random_string
      JWT_EXPIRES_IN: 7d
      ADMIN_SIGNUP_CODE: replace_with_a_private_invite_code
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend

volumes:
  infinity_pgdata:
